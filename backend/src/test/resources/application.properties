# Test-only fixture values - never used outside the test classpath, not real credentials.
# This file shadows src/main/resources/application.properties entirely on the test classpath,
# so it must repeat every key that file's own properties depend on, not just override one.
app.jwt.secret=test-only-secret-not-a-real-credential-minimum-32-bytes-long
app.jwt.expiration-ms=3600000
ai.provider=mock
app.cors.allowed-origins=http://localhost:5173
app.oauth2.frontend-redirect-uri=http://localhost:5173/oauth-callback
app.oauth2.frontend-login-uri=http://localhost:5173/login
# oauth2Login() needs at least one real ClientRegistration to exist for the filter chain to
# build at all - fake values, no test ever actually drives a real OAuth exchange.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
