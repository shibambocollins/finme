spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Azure App Service terminates TLS at its edge and forwards to the container over HTTP with
# X-Forwarded-* headers. Without this, Spring builds OAuth redirect_uri / verification links
# from the internal http://host:8080 request instead of https://<public-host>, breaking the
# Google OAuth callback (redirect_uri_mismatch).
server.forward-headers-strategy=framework

# Azure SQL Serverless auto-pauses when idle; the first connection after a pause returns
# "database not currently available" while it resumes (~30-60s). Wait for it on boot rather
# than failing the whole context init and cold-restarting.
spring.datasource.hikari.initialization-fail-timeout=60000

# Set explicitly so Hibernate does not need a live JDBC round-trip to detect the dialect -
# faster, deterministic startup, and resilient if the connection is briefly flaky during boot.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# update (not validate) so the first deploy against an empty finmedb creates the schema -
# no Flyway/Liquibase in this project, and this matches the dev profile.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
