spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT signing secret must be supplied via env var - never defaulted here (no hardcoded secrets).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Integration Layer provider selection: "mock" (default, no API calls) or "chain" (real
# Groq -> OpenRouter -> Cloudflare fallback chain - see com.finme.backend.ai.AiProviderConfig).
# Deliberately defaults to mock even with real keys present in .env - switching to "chain"
# spends real API quota on every statement upload, so that should be a conscious choice.
ai.provider=${AI_PROVIDER:mock}

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

openrouter.api-key=${OPENROUTER_API_KEY:}
# Free-tier slug - reconfirm at openrouter.ai/models periodically, these churn weekly.
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}

cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
cloudflare.model=${CLOUDFLARE_MODEL:@cf/meta/llama-3.1-8b-instruct}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth login (docs/03-system-design.md - converges on the same JWT AuthService issues
# for password login). Registration id "google" is enough for Spring Security to auto-fill
# authorization/token/user-info URIs via CommonOAuth2Provider.GOOGLE - only the secrets below
# are needed. Google Cloud Console's OAuth client needs an authorized redirect URI of
# http://localhost:8080/login/oauth2/code/google (Spring Security's default callback path).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth-callback}
app.oauth2.frontend-login-uri=${OAUTH2_FRONTEND_LOGIN_URI:http://localhost:5173/login}
