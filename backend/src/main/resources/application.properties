spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT signing secret must be supplied via env var - never defaulted here (no hardcoded secrets).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Integration Layer provider selection. "mock" is the only implementation until a real
# provider (Groq) is added and an API key exists - see docs/07-tech-stack.md.
ai.provider=${AI_PROVIDER:mock}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
