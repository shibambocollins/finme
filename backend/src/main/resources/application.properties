spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT signing secret must be supplied via env var - never defaulted here (no hardcoded secrets).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Integration Layer provider selection: "mock" (default, no API calls) or "chain" (real
# Groq -> OpenRouter -> Cloudflare fallback chain - see com.finme.backend.ai.AiProviderConfig).
# Deliberately defaults to mock even with real keys present in .env - switching to "chain"
# spends real API quota on every statement upload, so that should be a conscious choice.
ai.provider=${AI_PROVIDER:mock}

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
# The only currently-documented vision-capable model on Groq (console.groq.com/docs/vision).
groq.vision-model=${GROQ_VISION_MODEL:qwen/qwen3.6-27b}

openrouter.api-key=${OPENROUTER_API_KEY:}
# Free-tier slugs - reconfirm at openrouter.ai/models periodically, these churn weekly.
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
openrouter.vision-model=${OPENROUTER_VISION_MODEL:google/gemma-4-31b-it:free}

cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
cloudflare.model=${CLOUDFLARE_MODEL:@cf/meta/llama-3.1-8b-instruct}
cloudflare.vision-model=${CLOUDFLARE_VISION_MODEL:@cf/meta/llama-3.2-11b-vision-instruct}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google OAuth login (docs/03-system-design.md - converges on the same JWT AuthService issues
# for password login). Registration id "google" is enough for Spring Security to auto-fill
# authorization/token/user-info URIs via CommonOAuth2Provider.GOOGLE - only the secrets below
# are needed. Google Cloud Console's OAuth client needs an authorized redirect URI of
# http://localhost:8080/login/oauth2/code/google (Spring Security's default callback path).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Shared redirect targets - used by the OAuth2 login handlers AND email verification, both of
# which end in a browser redirect back to the SPA with (or without) a token in the query string.
app.auth.frontend-redirect-uri=${AUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth-callback}
app.auth.frontend-login-uri=${AUTH_FRONTEND_LOGIN_URI:http://localhost:5173/login}

# Email verification (Gmail SMTP + App Password - see docs/07-tech-stack.md; SendGrid's "free
# tier" is now a 60-day trial, not indefinitely free, so it doesn't fit a no-deadline project).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_ADDRESS:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8080}
app.email-verification.token-expiry-hours=${EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS:24}

# Weekly spend analysis email (FR-1.8.2). Monday 07:00 by default. Set WEEKLY_ANALYSIS_CRON to
# "-" to disable the job - Spring treats "-" as "never run", which is cleaner than commenting
# out an annotation. The dev profile disables it so a local run never mails anyone.
app.weekly-analysis.cron=${WEEKLY_ANALYSIS_CRON:0 0 7 * * MON}
app.weekly-analysis.zone=${WEEKLY_ANALYSIS_ZONE:Africa/Johannesburg}
