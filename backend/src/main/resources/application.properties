spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


ai.provider=${AI_PROVIDER:mock}

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.vision-model=${GROQ_VISION_MODEL:qwen/qwen3.6-27b}

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
openrouter.vision-model=${OPENROUTER_VISION_MODEL:google/gemma-4-31b-it:free}

cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
cloudflare.model=${CLOUDFLARE_MODEL:@cf/meta/llama-3.1-8b-instruct}
cloudflare.vision-model=${CLOUDFLARE_VISION_MODEL:@cf/meta/llama-3.2-11b-vision-instruct}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}


app.auth.frontend-redirect-uri=${AUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth-callback}
app.auth.frontend-login-uri=${AUTH_FRONTEND_LOGIN_URI:http://localhost:5173/login}

spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}

spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from-address=${MAIL_FROM_ADDRESS:}

app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8080}
app.email-verification.token-expiry-hours=${EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS:24}

app.weekly-analysis.cron=${WEEKLY_ANALYSIS_CRON:0 0 7 * * MON}
app.weekly-analysis.zone=${WEEKLY_ANALYSIS_ZONE:Africa/Johannesburg}
