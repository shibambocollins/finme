spring.datasource.url=jdbc:h2:mem:finme;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origins=http://localhost:5173

# The weekly email is off in development. A local run has real user rows in H2 and a real SMTP
# config available, so a scheduled send here would mail actual addresses from a dev machine.
# Trigger it deliberately instead - see WeeklyAnalysisSchedulerTest, or set the cron temporarily.
app.weekly-analysis.cron=-
